name: Install Simple Quant v2.8.4

on:
  push:
    branches:
      - main
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Pine script
        shell: bash
        run: |
          set -euo pipefail
          test -f .upload/READY || exit 0
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          upload_dir = Path('.upload')
          parts = sorted(upload_dir.glob('v2_8_4.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 payload parts, found {len(parts)}')

          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          packed = base64.b64decode(encoded, validate=True)
          packed_sha = hashlib.sha256(packed).hexdigest()
          expected_packed_sha = '2ffe04cef57136a148696a8fbf5617b5a672988912f3cdfb11f6508a29f66a69'
          if packed_sha != expected_packed_sha:
              raise SystemExit(f'Compressed payload SHA256 mismatch: {packed_sha}')

          raw = lzma.decompress(packed, format=lzma.FORMAT_XZ)
          actual_sha = hashlib.sha256(raw).hexdigest()
          expected_sha = '9569e5fd1b4f767789d94264189e891d190476bced45a6da5e49e5b18237a563'
          if actual_sha != expected_sha:
              raise SystemExit(f'Pine source SHA256 mismatch: {actual_sha}')

          target = Path('Simple_Quant_Plus_v2_8_4_HTF_CHART_CONTEXT_FIXED.pine')
          target.write_bytes(raw)
          print(f'Wrote {target} ({len(raw)} bytes, SHA256 {actual_sha})')
          PY

      - name: Update repository README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Scripts

          TradingView Pine scripts and supporting research artifacts.

          Current production candidate: `Simple_Quant_Plus_v2_8_4_HTF_CHART_CONTEXT_FIXED.pine`.

          Simple Quant+ v2.8.4 separates the confirmed Overall Trend and official Trigger/Decision engine from the visible chart-context data. The chart rows support 1m through 1D for DMI/ADX, MOM3/MOM6, estimated flow, EMA20, RVOL and trading ranges, while the official trigger remains on its independently configured 1–60m basis.

          Delta/CVD remains explicitly estimated from native 1-minute OHLCV; it is not bid/ask aggressor-classified order flow. Daily Traditional Pivot P/S1/R1 uses the previous completed native 1D H/L/C. Native TradingView compile and live/reload checks remain required before relying on alerts.

          Historical candidate retained: `Simple_Quant_Plus_v2_4_0_Final.pine`.
          EOF

      - name: Commit production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Simple_Quant_Plus_v2_8_4_HTF_CHART_CONTEXT_FIXED.pine
          git rm -r .upload
          git diff --cached --quiet && exit 0
          git commit -m "Promote Simple Quant+ v2.8.4"
          git push
